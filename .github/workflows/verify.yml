name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        maps: [missing-key, configured-key]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: https://api.example.invalid/api
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ matrix.maps == 'configured-key' && 'browser-test-key-not-a-real-google-key' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --omit=dev --audit-level=moderate

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cobuddy-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cobuddy_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cobuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cobuddy_test -d cobuddy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cobuddy_test:ci-only-password@localhost:5432/cobuddy_test
      DIRECT_URL: postgresql://cobuddy_test:ci-only-password@localhost:5432/cobuddy_test
      REDIS_URL: redis://localhost:6379/0
      JWT_ACCESS_SECRET: ci-only-access-key-not-for-deployment-123456
      JWT_REFRESH_SECRET: ci-only-refresh-key-not-for-deployment-123456
      JWT_MFA_SECRET: ci-only-mfa-key-not-for-deployment-123456
      ENCRYPTION_KEY_PII: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cobuddy-backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:validate
      - run: npm run prisma:migrate-deploy
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:api
      - run: npm audit --omit=dev --audit-level=moderate
