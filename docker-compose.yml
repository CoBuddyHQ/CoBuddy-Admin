services:
  postgres:
    image: postgres:16
    container_name: cobuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cobuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cobuddy_admin
      TZ: Asia/Kolkata
    ports:
      - '5432:5432'
    volumes:
      - ./cobuddy-backend/docker/data/postgres:/var/lib/postgresql/data
      - ./cobuddy-backend/docker/pg-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cobuddy -d cobuddy_admin']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cobuddy-net

  redis:
    image: redis:7-alpine
    container_name: cobuddy-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}']
    environment:
      TZ: Asia/Kolkata
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - '6379:6379'
    volumes:
      - ./cobuddy-backend/docker/data/redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cobuddy-net

  backend:
    build:
      context: ./cobuddy-backend
      dockerfile: Dockerfile
    image: cobuddy-admin-backend:latest
    container_name: cobuddy-admin-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      PORT: 4000
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://cobuddy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/cobuddy_admin?schema=public&sslmode=prefer
      DIRECT_URL: postgresql://cobuddy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/cobuddy_admin?schema=public&sslmode=prefer
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      JWT_MFA_SECRET: ${JWT_MFA_SECRET:?Set JWT_MFA_SECRET in .env}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      BCRYPT_SALT_ROUNDS: 12
      ENCRYPTION_KEY_PII: ${ENCRYPTION_KEY_PII:?Set ENCRYPTION_KEY_PII in .env}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in .env}
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      FRONTEND_URL: http://localhost:3000
      CUSTOMER_API_URL: http://host.docker.internal:4002
      COMPANION_API_URL: http://host.docker.internal:4001
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cobuddy-net

  frontend:
    build:
      context: ./cobuddy-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    image: cobuddy-admin-frontend:latest
    container_name: cobuddy-admin-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_started
    networks:
      - cobuddy-net

networks:
  cobuddy-net:
    driver: bridge
